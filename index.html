<!doctype html>
<html class="pixel-mode">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panna Cotta</title>
  <meta name="description" content="Support Panna Cotta">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    @font-face {
      font-family: 'Pixelated Times New Roman';
      src: url('/assets/fonts/pixelated-times-new-roman.otf.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    html.pixel-mode, body.pixel-mode, .pixel-mode {
      font-family: 'Pixelated Times New Roman', Times New Roman, Times, serif !important;
      font-size: 18px;
      letter-spacing: 0.01em;
      font-variant-ligatures: none;
      font-feature-settings: "liga" off, "kern" off;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Trans flag banner */
    .trans-flag {
      width: 100%;
      height: 30px;
      background: linear-gradient(to bottom, 
        #5BCEFA 0%, #5BCEFA 20%, 
        #F5A9B8 20%, #F5A9B8 40%, 
        #FFFFFF 40%, #FFFFFF 60%, 
        #F5A9B8 60%, #F5A9B8 80%, 
        #5BCEFA 80%, #5BCEFA 100%);
    }
    /* Account menu styles */
    .account-menu {
      position: relative;
      display: inline-block;
      float: right;
    }
    .account-btn {
      cursor: pointer;
      padding: 4px 12px;
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #7f7f7f;
      border-bottom-color: #7f7f7f;
    }
    .account-btn:active {
      border: 2px solid #7f7f7f;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }
    .account-popup {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 5px;
      background: #c0c0c0;
      border: 2px solid #000;
      padding: 15px;
      min-width: 300px;
      box-shadow: 4px 4px 0 #000;
      z-index: 1000;
    }
    .account-popup.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <img class="logo" src="data:image/gif;base64,R0lGODlhIAAgAIABAP8AAP///yH5BAEAAAEALAAAAAAgACAAAAL+jI+py+0Po5y02ouz3rz7D4biSJbmiabqyrbuC8fyrvdBfJH0UAAAOw==" alt="*">
      <img src="minecraft_title-2.png" alt="Minecraft Title" style="display: block; max-width: 100%; height: auto; margin: 10px 0;">
      <h1>Panna Cotta</h1>
    </div>

    <div class="navbar">
      <b>Home</b> | <a href="https://github.com/RoseTheLocalFem">GitHub</a>
      <div class="account-menu">
        <div class="account-btn" onclick="toggleAccountMenu()">Account</div>
        <div class="account-popup" id="accountPopup">
          <p>what are you? stupid? why tf would this need an account?</p>
        </div>
      </div>
  <!-- Pixel Mode always ON -->
    </div>

    <div class="content">
      <div class="win95-panel">
        <marquee behavior="scroll" direction="left" scrollamount="4">Welcome to Panna Cotta! Support us via PayPal below!</marquee>
      </div>

      <h2>Support Us</h2>
      <p>Help support Panna Cotta by donating via PayPal:</p>
      
      <!-- PayPal Donate Button -->
      <div style="text-align: center; margin: 20px 0;">
        <form action="https://www.paypal.com/donate" method="post" target="_top">
          <input type="hidden" name="business" value="YOUR_PAYPAL_EMAIL@example.com" />
          <input type="hidden" name="no_recurring" value="0" />
          <input type="hidden" name="item_name" value="Support Panna Cotta" />
          <input type="hidden" name="currency_code" value="USD" />
          <input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif" border="0" name="submit" title="PayPal - The safer, easier way to pay online!" alt="Donate with PayPal button" />
        </form>
      </div>

  <!-- About section removed -->
    </div>

    <div class="footer">
      <!-- Trans Pride Flag Banner -->
      <div class="trans-flag"></div>
    </div>
  </div>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script>
  // Pixel Mode always ON
  document.documentElement.classList.add('pixel-mode');
  
  // Account menu toggle
  function toggleAccountMenu() {
    const popup = document.getElementById('accountPopup');
    popup.classList.toggle('show');
  }
  
  // Close popup when clicking outside
  document.addEventListener('click', function(event) {
    const menu = document.querySelector('.account-menu');
    const popup = document.getElementById('accountPopup');
    if (menu && !menu.contains(event.target)) {
      popup.classList.remove('show');
    }
  });
  </script>
</body>
</html>
